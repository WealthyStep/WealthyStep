name: Supabase Database Keepalive

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keepalive Health Endpoint
        run: |
          echo "Pinging Wealthy Step keepalive health endpoint..."
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" https://wealthystep.com/api/health/)
          echo "HTTP Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Warning: Keepalive ping returned non-200 status code ($HTTP_STATUS)"
            exit 1
          fi
          echo "Keepalive ping successful! Database kept active."
